<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>InkluMaster — Komunikasi Inklusif Lab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#3b82f6;--accent2:#10b981;--red:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--surface:#232738}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}

.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:18px;font-weight:700}
.header h1 span{color:var(--accent)}
.room-badge{background:var(--accent);color:#fff;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600}

/* MODE TABS */
.tabs{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:12px 8px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tab[data-mode="dosen"] .dot{background:#fff}
.tab[data-mode="mhs"] .dot{background:var(--accent2)}
.tab.active[data-mode="mhs"]{background:var(--accent2);border-color:var(--accent2)}
.tab.active[data-mode="mhs"] .dot{background:#fff}

.main{flex:1;display:flex;overflow:hidden;min-height:0}
.main.split{flex-direction:row}
@media(max-width:820px){.main.split{flex-direction:column}}

.panel{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel.hidden{display:none}
.main.split .panel+.panel{border-left:2px solid var(--border)}
@media(max-width:820px){.main.split .panel+.panel{border-left:none;border-top:2px solid var(--border)}}

.panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.panel-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.panel-title .dot{width:9px;height:9px;border-radius:50%}
.dot-blue{background:var(--accent)}
.dot-green{background:var(--accent2)}
.clear-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}

.messages{flex:1;display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;padding:11px 15px;border-radius:14px;font-size:16px;line-height:1.45;word-wrap:break-word;overflow-wrap:anywhere;animation:fadeIn .18s}
.msg-dosen{background:var(--accent);color:#fff;align-self:flex-start;border-bottom-left-radius:5px}
.msg-mhs{background:var(--accent2);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg-time{font-size:11px;opacity:.75;margin-top:5px}
.msg-live{background:var(--surface);border:1px dashed var(--accent);color:var(--text);align-self:flex-start;border-bottom-left-radius:5px}
.msg-live .rec{display:inline-block;width:7px;height:7px;background:var(--red);border-radius:50%;margin-left:7px;animation:pulse 1s infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

.controls{padding:14px 16px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
.mic-area{display:flex;align-items:center;gap:14px}
.mic-btn{width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.mic-btn.off{background:var(--accent);color:#fff}
.mic-btn.on{background:var(--red);color:#fff;box-shadow:0 0 0 5px rgba(239,68,68,.25)}
.mic-btn svg{width:26px;height:26px}
.mic-label{font-size:16px;font-weight:600}
.mic-status{font-size:13px;color:var(--muted);margin-top:2px}
.mic-status.active{color:var(--red)}

.input-area{display:flex;gap:9px}
.input-area input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:11px;font-size:16px;outline:none;min-width:0}
.input-area input:focus{border-color:var(--accent2)}
.send-btn{background:var(--accent2);color:#fff;border:none;padding:0 22px;border-radius:11px;cursor:pointer;font-size:15px;font-weight:600}

.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:24px}
.footer{text-align:center;padding:9px;font-size:12px;color:var(--muted);background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 20px;border-radius:9px;font-size:14px;z-index:99;opacity:0;transition:opacity .3s;border:1px solid var(--border);max-width:88%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1><span>Inklu</span>Master</h1>
  <div class="room-badge">Room: LAB-A</div>
</div>

<div class="tabs">
  <button class="tab active" data-mode="dosen" onclick="setMode('dosen')"><span class="dot"></span>Dosen</button>
  <button class="tab" data-mode="mhs" onclick="setMode('mhs')"><span class="dot"></span>Mahasiswa</button>
  <button class="tab" data-mode="both" onclick="setMode('both')">Keduanya</button>
</div>

<div class="main" id="mainArea">
  <div class="panel" id="panelDosen">
    <div class="panel-header">
      <div class="panel-title"><div class="dot dot-blue"></div> Dosen — Speech to Text</div>
      <button class="clear-btn" onclick="clearDosen()">Bersihkan</button>
    </div>
    <div class="messages" id="dosenMessages">
      <div class="empty" id="dosenEmpty">Tekan tombol mikrofon untuk mulai berbicara</div>
    </div>
    <div class="controls">
      <div class="mic-area">
        <button class="mic-btn off" id="micBtn" onclick="toggleMic()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <div>
          <div class="mic-label" id="micLabel">Mikrofon Mati</div>
          <div class="mic-status" id="micStatus">Klik untuk mulai transkripsi</div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel hidden" id="panelMhs">
    <div class="panel-header">
      <div class="panel-title"><div class="dot dot-green"></div> Mahasiswa Tunarungu — Teks</div>
      <button class="clear-btn" onclick="clearMhs()">Bersihkan</button>
    </div>
    <div class="messages" id="mhsMessages">
      <div class="empty" id="mhsEmpty">Ketik pertanyaan di bawah untuk dosen</div>
    </div>
    <div class="controls">
      <div class="input-area">
        <input type="text" id="mhsInput" placeholder="Ketik pertanyaan..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMhs()">
        <button class="send-btn" onclick="sendMhs()">Kirim</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">Dibuat Oleh Kukuh Yudhistiro untuk Mahasiswa Inklusi.</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   FIX DUPLIKAT DI ANDROID / MOBILE CHROME
   ------------------------------------------------------------
   Penyebab di mobile:
   1. continuous=true DIABAIKAN oleh Android Chrome. Engine
      memotong sesi tiap jeda pendek lalu emit final berulang.
   2. e.resultIndex sering reset ke 0, sehingga loop dari
      resultIndex memproses ulang hasil final yang SUDAH tampil.
   3. Android mengeluarkan "progressive final": "selamat" lalu
      "selamat malam" -> keduanya berstatus isFinal.

   Solusi berlapis:
   A. Deteksi mobile -> continuous=false, restart manual.
   B. Tandai tiap hasil final yang sudah diproses per-sesi
      (processedIdx) sehingga tidak diproses dua kali.
   C. Dedup semantik: jika teks final baru SAMA atau merupakan
      perpanjangan/prefix dari final sebelumnya dalam jendela
      waktu tertentu -> update bubble lama, bukan buat baru.
============================================================ */

var IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

var recognition = null;
var wantListening = false;
var restartTimer = null;
var liveEl = null;

// dedup state
var processedIdx = {};      // index hasil final yang sudah diproses (per sesi)
var lastFinalRaw = '';      // teks final terakhir
var lastFinalEl = null;     // elemen bubble final terakhir
var lastFinalTime = 0;      // timestamp final terakhir
var MERGE_WINDOW = 6000;    // ms — jendela penggabungan progressive final

function norm(t){
  return (t||'').toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
}

function setMode(m){
  var tabs = document.querySelectorAll('.tab');
  for (var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-mode')===m);
  }
  var pd = document.getElementById('panelDosen');
  var pm = document.getElementById('panelMhs');
  var main = document.getElementById('mainArea');
  pd.classList.toggle('hidden', m==='mhs');
  pm.classList.toggle('hidden', m==='dosen');
  main.classList.toggle('split', m==='both');
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2600);
}

function now(){
  return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function setMicUI(on){
  document.getElementById('micBtn').className = on?'mic-btn on':'mic-btn off';
  document.getElementById('micLabel').textContent = on?'Mikrofon Aktif':'Mikrofon Mati';
  var s=document.getElementById('micStatus');
  s.textContent = on?'Mendengarkan... Bicara sekarang':'Klik untuk mulai transkripsi';
  s.className = on?'mic-status active':'mic-status';
}

function buildRecognition(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;

  var r = new SR();
  r.lang='id-ID';
  // KUNCI: di mobile continuous=true justru memicu emit ganda
  r.continuous = IS_MOBILE ? false : true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  processedIdx = {}; // reset penanda tiap sesi baru

  r.onresult = function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var res = e.results[i];
      var txt = res[0].transcript;

      if(res.isFinal){
        // Lapis B: cegah index yang sama diproses dua kali
        if(processedIdx[i]) continue;
        processedIdx[i]=true;
        finalizeDosen(txt);
      } else {
        interim += txt;
      }
    }
    if(interim) showLive(interim);
  };

  r.onerror = function(e){
    if(e.error==='no-speech'||e.error==='aborted') return;
    if(e.error==='not-allowed'){
      toast('Izin mikrofon ditolak. Izinkan akses mikrofon di browser.');
      wantListening=false; setMicUI(false); return;
    }
    if(e.error==='network'){ toast('Koneksi speech terputus. Mencoba ulang...'); return; }
  };

  r.onend = function(){
    recognition = null;
    if(!wantListening) return;
    clearTimeout(restartTimer);
    restartTimer = setTimeout(function(){
      if(!wantListening) return;
      try{
        recognition = buildRecognition();
        if(recognition) recognition.start();
      }catch(err){
        restartTimer = setTimeout(function(){
          if(!wantListening) return;
          try{ recognition=buildRecognition(); if(recognition) recognition.start(); }catch(e2){}
        },900);
      }
    }, IS_MOBILE ? 120 : 300);
  };

  return r;
}

function toggleMic(){ if(wantListening) stopMic(); else startMic(); }

function startMic(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Browser tidak mendukung. Gunakan Chrome/Edge.'); return; }
  wantListening=true; setMicUI(true);
  lastFinalRaw=''; lastFinalEl=null; lastFinalTime=0;
  recognition = buildRecognition();
  try{ recognition.start(); }
  catch(e){ toast('Gagal start mikrofon: '+e.message); wantListening=false; setMicUI(false); }
}

function stopMic(){
  wantListening=false;
  clearTimeout(restartTimer);
  setMicUI(false);
  if(liveEl){ liveEl.remove(); liveEl=null; }
  if(recognition){ try{recognition.abort();}catch(e){} recognition=null; }
  lastFinalRaw=''; lastFinalEl=null; lastFinalTime=0;
}

/* ---------- RENDER PESAN DOSEN ---------- */
function showLive(text){
  var box=document.getElementById('dosenMessages');
  var emp=document.getElementById('dosenEmpty'); if(emp) emp.remove();
  if(!liveEl){
    liveEl=document.createElement('div');
    liveEl.className='msg msg-live';
    box.appendChild(liveEl);
  }
  liveEl.innerHTML='';
  var s=document.createElement('span'); s.textContent=text; liveEl.appendChild(s);
  var r=document.createElement('span'); r.className='rec'; liveEl.appendChild(r);
  box.scrollTop=box.scrollHeight;
}

function buildBubble(text){
  var d=document.createElement('div');
  d.className='msg msg-dosen';
  var s=document.createElement('span'); s.className='txt'; s.textContent=text; d.appendChild(s);
  var t=document.createElement('div'); t.className='msg-time'; t.textContent=now(); d.appendChild(t);
  return d;
}

function finalizeDosen(text){
  text=(text||'').trim();
  var box=document.getElementById('dosenMessages');
  var emp=document.getElementById('dosenEmpty'); if(emp) emp.remove();
  if(liveEl){ liveEl.remove(); liveEl=null; }
  if(!text) return;

  var nNew=norm(text), nOld=norm(lastFinalRaw);
  var ts=Date.now();
  var inWindow = (ts - lastFinalTime) < MERGE_WINDOW;

  // Lapis C: dedup semantik
  if(lastFinalEl && nOld && inWindow){
    // 1. Persis sama -> abaikan
    if(nNew === nOld) return;
    // 2. Hasil baru perpanjangan hasil lama -> update bubble lama
    if(nNew.indexOf(nOld) === 0){
      lastFinalEl.querySelector('.txt').textContent = text;
      lastFinalEl.querySelector('.msg-time').textContent = now();
      lastFinalRaw = text; lastFinalTime = ts;
      box.scrollTop = box.scrollHeight;
      return;
    }
    // 3. Hasil baru potongan lebih pendek dari yang lama -> abaikan
    if(nOld.indexOf(nNew) === 0) return;
  }

  var el = buildBubble(text);
  box.appendChild(el);
  lastFinalEl=el; lastFinalRaw=text; lastFinalTime=ts;
  box.scrollTop=box.scrollHeight;
}

function clearDosen(){
  document.getElementById('dosenMessages').innerHTML='<div class="empty" id="dosenEmpty">Tekan tombol mikrofon untuk mulai berbicara</div>';
  liveEl=null; lastFinalEl=null; lastFinalRaw=''; lastFinalTime=0; processedIdx={};
}

/* ---------- MAHASISWA ---------- */
function sendMhs(){
  var inp=document.getElementById('mhsInput');
  var text=inp.value.trim();
  if(!text) return;
  var emp=document.getElementById('mhsEmpty'); if(emp) emp.remove();
  var box=document.getElementById('mhsMessages');
  var d=document.createElement('div'); d.className='msg msg-mhs';
  var s=document.createElement('span'); s.textContent=text; d.appendChild(s);
  var t=document.createElement('div'); t.className='msg-time'; t.textContent=now(); d.appendChild(t);
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  inp.value=''; inp.focus();
}

function clearMhs(){
  document.getElementById('mhsMessages').innerHTML='<div class="empty" id="mhsEmpty">Ketik pertanyaan di bawah untuk dosen</div>';
}
</script>
</body>
</html>

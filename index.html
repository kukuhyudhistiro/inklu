<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>InkluMaster — Komunikasi Inklusif Lab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--accent:#3b82f6;--accent2:#10b981;--red:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--surface:#232738}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}

.header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:18px;font-weight:700}
.header h1 span{color:var(--accent)}
.room-badge{background:var(--accent);color:#fff;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600}

/* MODE TABS */
.tabs{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:12px 8px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tab[data-mode="dosen"] .dot{background:#fff}
.tab[data-mode="mhs"] .dot{background:var(--accent2)}
.tab.active[data-mode="mhs"]{background:var(--accent2);border-color:var(--accent2)}
.tab.active[data-mode="mhs"] .dot{background:#fff}

.main{flex:1;display:flex;overflow:hidden;min-height:0}
.main.split{flex-direction:row}
@media(max-width:820px){.main.split{flex-direction:column}}
